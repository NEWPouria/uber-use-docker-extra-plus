name: CI - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for CI
        run: |
          echo "POSTGRES_DB=ci_test_db" >> .env
          echo "POSTGRES_USER=ci_user" >> .env
          echo "POSTGRES_PASSWORD=ci_password_123" >> .env

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - name: Build custom services
        run: docker compose build --pull

      - name: Start all services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          sleep 30
          docker compose ps

      - name: Test Nginx (API Gateway)
        run: |
          curl -f http://localhost/ || echo "Nginx returned non-200 (expected for / route)"

      - name: Test Grafana
        run: curl -f http://localhost:3000/api/health

      - name: Test Prometheus
        run: curl -f http://localhost:9090/-/healthy

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
